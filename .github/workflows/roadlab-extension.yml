name: Build RoadLab update feed
on:
  push:
    branches: [feature/road-lab-updater]
    paths:
      - 'road-lab-updater/extension/**'
      - 'road-lab-updater/tools/**'
      - '.github/workflows/roadlab-extension.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roadlab-update-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/road-lab-updater
      - name: Install Blender 5.1 build runtime
        run: |
          curl --fail --location https://download.blender.org/release/Blender5.1/blender-5.1.0-linux-x64.tar.xz --output /tmp/blender.tar.xz
          mkdir /tmp/roadlab-blender
          tar -xf /tmp/blender.tar.xz --strip-components=1 -C /tmp/roadlab-blender
      - name: Test Blender 5.2 compatibility
        run: |
          curl --fail --location https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz --output /tmp/blender52.tar.xz
          mkdir /tmp/roadlab-blender52
          tar -xf /tmp/blender52.tar.xz --strip-components=1 -C /tmp/roadlab-blender52
          for test in road-lab-updater/tests/*_blender.py; do
            /tmp/roadlab-blender52/blender -b --factory-startup -t 4 --python-exit-code 1 --python "$test"
          done
      - name: Test saved sidewalk graph upgrades
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_sidewalk_upgrade_blender.py
      - name: Test sidewalk corner winding and overlap
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_sidewalk_corners_blender.py
      - name: Test isolated sidewalk width drafts and acceptance
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_sidewalk_width_blender.py
      - name: Test width brushes and road extension preview
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_sculpt_tools_blender.py
      - name: Test live road grading and edge-brush terrain clearance
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_road_grade_preview_blender.py
      - name: Test modifier input compatibility on Blender 5.1
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_modifier_inputs_blender.py
      - name: Test marking approach logic
        run: python road-lab-updater/tests/test_marking_approaches.py
      - name: Test local sculpt preview, seam preservation and commit
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_sculpt_preview_blender.py
      - name: Test lane window selection and guidance
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_lane_window_blender.py
      - name: Test live marking preview and street connections
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_lane_connections_blender.py
      - name: Test lane preservation when adding streets
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_lane_branch_preservation_blender.py
      - name: Test editable road and terrain example
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_editable_example_blender.py
      - name: Test crosswalk ramps and preview rollback
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_crosswalk_ramps_blender.py
      - name: Test F joins and closed-loop lane preservation
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_lane_join_blender.py
      - name: Test raised crosswalk clearance
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_raised_crosswalk_blender.py
      - name: Test interior road connections
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_connect_interior_blender.py
      - name: Test sidewalk slabs and curb clearance
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_sidewalk_slabs_blender.py
      - name: Test editable surface bounds
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_surface_bounds_blender.py
      - name: Test offline PBR materials
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_pbr_materials_blender.py
      - name: Test lane pocket taper logic
        run: python road-lab-updater/tests/test_lane_pockets.py
      - name: Test sidewalk panel topology
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_sidewalk_panels_blender.py
      - name: Test lane pocket geometry and markings
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_lane_pockets_blender.py
      - name: Test lane preview isolation and realization
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_lane_add_preview_blender.py
      - name: Test example World preservation
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_example_world_blender.py
      - name: Test curved lane pocket markings
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_curved_lane_pocket_blender.py
      - name: Test through lanes and receiving merges
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_through_lane_blender.py
      - name: Test surface frames and edit batching
        run: /tmp/roadlab-blender/blender -b --factory-startup --python-exit-code 1 --python road-lab-updater/tests/test_surface_frames_blender.py
      - name: Validate and build repository
        env:
          BLENDER: /tmp/roadlab-blender/blender
        run: bash road-lab-updater/tools/build_repository.sh
      - name: Publish generated feed to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add road-lab-updater/dist/stable
          if ! git diff --cached --quiet; then
            git commit -m 'Publish RoadLab extension update feed'
            git push origin HEAD:feature/road-lab-updater
          fi
